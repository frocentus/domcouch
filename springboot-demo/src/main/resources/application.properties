# Spring Boot Application
spring.application.name=domcouch-demo
server.port=8080

# DomCouch — Couchbase connection
domcouch.connection-string=couchbase://localhost
domcouch.username=Administrator
domcouch.password=password
domcouch.bucket=domcouch
domcouch.database=contacts

# Logging
logging.level.com.domcouch=INFO
logging.level.com.couchbase.client=WARN
