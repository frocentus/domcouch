version: "3.8"

services:
  couchbase:
    image: couchbase/server:community-8.0.1
    container_name: domcouch-cb
    ports:
      - "8091:8091" # Web Console
      - "8092:8092" # Views API
      - "8093:8093" # Query (N1QL)
      - "8094:8094" # Search (FTS)
      - "11210:11210" # Data (SDK)
      - "11207:11207" # TLS Data
    environment:
      COUCHBASE_ADMINISTRATOR_USERNAME: Administrator
      COUCHBASE_ADMINISTRATOR_PASSWORD: password
      COUCHBASE_BUCKET: domcouch
      COUCHBASE_BUCKET_RAMSIZE: "512"
      COUCHBASE_BUCKET_TYPE: couchbase
      COUCHBASE_INDEX_RAM_SIZE: "256"
      COUCHBASE_FTS_RAM_SIZE: "256"
    volumes:
      - couchbase-data:/opt/couchbase/var
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/pools"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  couchbase-data:
    driver: local
